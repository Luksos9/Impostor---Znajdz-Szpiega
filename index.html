<!doctype html>
<html lang="pl" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFF8EC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#181412" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Polska gra imprezowa na jeden telefon. Opisuj słowa, znajdź impostora, dobrze się baw." />

    <!-- PWA icons -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/pwa-192x192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />

    <!-- iOS: tell Safari this is a standalone webapp and how to render it -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Impostor" />
    <meta name="mobile-web-app-capable" content="yes" />

    <title>Impostor — Gra imprezowa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
      /* ─── Theme tokens as CSS variables ───
         Components import { colors } from styles/theme.js, where each value is
         a var(--…) string. Switching theme = swapping data-theme on <html>. */
      :root,
      :root[data-theme="light"] {
        --color-bg:           #FFF8EC;
        --color-bg-subtle:    #FFF3DD;
        --color-surface:      #FFFFFF;
        --color-surface-raised:#FFFFFF;
        --color-surface-subtle:#FFF3DD;

        --color-border:       #E5E0D2;
        --color-border-strong:#D4CEBE;

        --color-text-primary: #2B2B2B;
        --color-text-secondary:#6B6258;
        --color-text-muted:   #A39C8E;
        --color-text-dim:     #C9C2B3;

        --color-overlay:      rgba(43, 43, 43, 0.55);

        --shadow-soft:        rgba(43, 43, 43, 0.06);
        --shadow-medium:      rgba(43, 43, 43, 0.10);
        --shadow-strong:      rgba(43, 43, 43, 0.18);
        --shadow-tactile-neutral: #C9C2B3;
        --focus-ring:         rgba(43, 43, 43, 0.18);

        --illustration-bg:    #FFF8EC;

        color-scheme: light;
      }

      :root[data-theme="dark"] {
        --color-bg:           #181412;
        --color-bg-subtle:    #1F1A17;
        --color-surface:      #262220;
        --color-surface-raised:#2E2926;
        --color-surface-subtle:#1F1A17;

        --color-border:       #3A3531;
        --color-border-strong:#4D4844;

        --color-text-primary: #F5F0E5;
        --color-text-secondary:#B8B0A2;
        --color-text-muted:   #8A8278;
        --color-text-dim:     #5C5650;

        --color-overlay:      rgba(0, 0, 0, 0.7);

        --shadow-soft:        rgba(0, 0, 0, 0.35);
        --shadow-medium:      rgba(0, 0, 0, 0.45);
        --shadow-strong:      rgba(0, 0, 0, 0.6);
        --shadow-tactile-neutral: #000000;
        --focus-ring:         rgba(255, 255, 255, 0.22);

        --illustration-bg:    #FFF8EC;

        color-scheme: dark;
      }

      html, body, #root {
        margin: 0;
        padding:
          env(safe-area-inset-top, 0px)
          env(safe-area-inset-right, 0px)
          env(safe-area-inset-bottom, 0px)
          env(safe-area-inset-left, 0px);
        min-height: 100%;
        background-color: var(--color-bg);
        color: var(--color-text-primary);
        font-family: 'Nunito', system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overscroll-behavior-y: none;
        transition: background-color 220ms ease, color 220ms ease;
      }
      * { box-sizing: border-box; }
      button {
        font-family: inherit;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }
      input, textarea { font-family: inherit; }

      .anim-enter {
        animation: fadeSlideUp 360ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .anim-fade {
        animation: fadeIn 280ms ease both;
      }
      .anim-stagger {
        animation: fadeSlideUp 360ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .anim-pop {
        animation: pop 420ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .anim-bob {
        animation: bob 2800ms ease-in-out infinite;
      }

      @keyframes fadeSlideUp {
        from { opacity: 0; transform: translateY(12px) scale(0.98); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      @keyframes pop {
        0%   { opacity: 0; transform: scale(0.6); }
        60%  { opacity: 1; transform: scale(1.12); }
        100% { transform: scale(1); }
      }
      @keyframes bob {
        0%, 100% { transform: translateY(0); }
        50%      { transform: translateY(-4px); }
      }
      @keyframes bounceIn {
        0%   { opacity: 0; transform: scale(0.3); }
        50%  { opacity: 1; transform: scale(1.08); }
        70%  { transform: scale(0.95); }
        100% { transform: scale(1); }
      }
      .anim-bounce {
        animation: bounceIn 500ms cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        20%      { transform: translateX(-8px); }
        40%      { transform: translateX(8px); }
        60%      { transform: translateX(-4px); }
        80%      { transform: translateX(4px); }
      }
      .anim-shake {
        animation: shake 400ms ease both;
      }
      @keyframes glowPulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(43, 179, 115, 0); }
        50%      { box-shadow: 0 0 20px 4px rgba(43, 179, 115, 0.4); }
      }
      .anim-glow {
        animation: glowPulse 1.2s ease-in-out 0.5s 2;
      }
      @keyframes slideInRight {
        from { opacity: 0; transform: translateX(40px); }
        to   { opacity: 1; transform: translateX(0); }
      }
      .anim-slide-right {
        animation: slideInRight 350ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      @keyframes confettiFall {
        0%   { transform: translateY(0) rotate(0deg) translateX(0); opacity: 1; }
        25%  { transform: translateY(25vh) rotate(180deg) translateX(15px); }
        50%  { transform: translateY(50vh) rotate(360deg) translateX(-10px); }
        75%  { transform: translateY(75vh) rotate(540deg) translateX(12px); }
        100% { transform: translateY(105vh) rotate(720deg) translateX(-5px); opacity: 0; }
      }
      .anim-confetti {
        animation: confettiFall 2.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
      }

      @media (prefers-reduced-motion: reduce) {
        .anim-enter, .anim-fade, .anim-stagger, .anim-pop, .anim-bob,
        .anim-bounce, .anim-shake, .anim-glow, .anim-slide-right,
        .anim-confetti { animation: none !important; }
        html, body, #root { transition: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
